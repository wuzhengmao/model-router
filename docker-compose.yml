services:
  model-router:
    build: .
    image: wuzm219/model-router:latest
    ports:
      - "18080:18080"
    environment:
      MODEL_ROUTER_LISTEN: "0.0.0.0:18080"
      # 可按需覆盖其他顶层配置（§8.9）：
      # MODEL_ROUTER_AUTH_TOKEN: "replace-with-your-client-token"
      # MODEL_ROUTER_ADMIN_USER: "admin"
      # MODEL_ROUTER_ADMIN_PASSWORD: "replace-with-your-admin-password"
    volumes:
      # 配置与统计（stats.json）同目录，二者一起持久化；不映射该目录时
      # 统计仍会落在容器内，但容器重建后会随容器一起丢失。
      - ./.docker:/home/nonroot/config:rw
    restart: unless-stopped
